# Novera CI — typecheck, lint, schema push, tests.
#
# Notes:
# - The suite bootstraps its own SQLite db (tests/global-setup.ts →
#   db/test.db); the DATABASE_URL env below is a process default/fallback,
#   not the file the suite ultimately uses.
# - DATABASE_URL=file:./db/ci.db is a throwaway database used to prove the
#   schema pushes cleanly on a fresh checkout (Prisma resolves relative
#   SQLite URLs against prisma/, so this materializes prisma/db/ci.db).
#   Never point CI at db/custom.db — that is local dev data.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Local dev currently runs bun 1.3.x; the lockfile (v1 text format) is
      # shared across 1.2/1.3 — bump this pin when convenient.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit
        continue-on-error: false

      - name: Lint
        run: bun run lint

      - name: Push Prisma schema to CI database
        run: DATABASE_URL=file:./db/ci.db bunx prisma db push --skip-generate

      - name: Run tests
        run: bunx vitest run
        env:
          DATABASE_URL: file:./db/ci.db
